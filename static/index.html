<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensor Temperature</title>
<!-- Chart.js library for rendering the time-series temperature chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
<style>
/* Dark theme styling — similar to a terminal dashboard aesthetic */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
h1 { margin-bottom: 12px; font-size: 1.5rem; color: #38bdf8; }
.controls { margin-bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.controls label { font-size: 0.875rem; color: #94a3b8; }
.controls select { padding: 6px 12px; border: 1px solid #334155; border-radius: 6px; background: #1e293b; color: #e2e8f0; font-size: 0.875rem; }
.controls span { font-size: 0.875rem; color: #94a3b8; }
.controls .current-temp { color: #4ade80; font-weight: 600; }
.chart-container { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
</style>
</head>
<body>
<h1>Sensor Temperature Monitor</h1>
<!-- Control bar: time range selector, current temps, and last-updated timestamp -->
<div class="controls">
  <label for="range">Range:</label>
  <select id="range">
    <option value="1">Last hour</option>
    <option value="6" selected>Last 6 hours</option>
    <option value="24">Last 24 hours</option>
  </select>
  <span>| Current: <span id="current-temp" class="current-temp">--</span></span>
  <span>Updated: <span id="updated-at">--</span></span>
</div>
<!-- Canvas where Chart.js renders the temperature-over-time line chart -->
<div class="chart-container">
  <canvas id="temp-chart"></canvas>
</div>

<script>
// Get the 2D drawing context from the canvas element
const ctx = document.getElementById("temp-chart").getContext("2d");

// Initialize a Chart.js line chart with an empty dataset (populated by fetchData)
const chart = new Chart(ctx, {
  type: "line",
  data: { datasets: [] },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { color: "#94a3b8" } } },
    scales: {
      x: {
        type: "linear",  // X-axis = milliseconds since epoch (numeric, not categorical)
        ticks: {
          color: "#64748b",
          maxTicksLimit: 12,
          // Format the tick value (epoch ms) into HH:MM time string
          callback: v => { const d = new Date(v); return `${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`; },
        },
        grid: { color: "#1e293b" },
      },
      y: { title: { display: true, text: "Temperature (°C)", color: "#94a3b8" }, ticks: { color: "#64748b" }, grid: { color: "#334155" } },
    },
  },
});
chart.canvas.parentElement.style.height = "400px";

// Color palette for up to 5 sensor lines (cycles if more sensors exist)
const colors = ["#38bdf8", "#4ade80", "#f472b6", "#fbbf24", "#a78bfa"];

// fetchData queries the /api/temps endpoint and rebuilds the chart datasets
// Each unique sensor gets its own line (dataset) with its time-series points
function fetchData(hours) {
  fetch(`/api/temps?hours=${hours}`)
    .then(r => r.json())
    .then(data => {
      // Extract unique sensor names using a Set (like Python's set())
      const sensors = [...new Set(data.map(d => d.sensor))];
      // Build one dataset per sensor with {x: epoch_ms, y: temp_c} points
      const datasets = sensors.map((sensor, i) => {
        const points = data.filter(d => d.sensor === sensor);
        return {
          label: sensor,
          data: points.map(p => ({ x: new Date(p.created_at).getTime(), y: p.temp_c })),
          borderColor: colors[i % colors.length],
          backgroundColor: colors[i % colors.length] + "33",
          fill: false,
          tension: 0.3,   // Smooth curves between points
          pointRadius: 2,
        };
      });
      chart.data = { datasets };
      chart.update();
    });
}

// fetchCurrent gets the latest temp per sensor and displays it in the control bar
function fetchCurrent() {
  fetch("/api/current")
    .then(r => r.json())
    .then(data => {
      if (data.length > 0) {
        // Format: "sensor1: 45.0°C, sensor2: 52.3°C"
        const temps = data.map(d => `${d.sensor}: ${d.temp_c.toFixed(1)}°C`).join(", ");
        document.getElementById("current-temp").textContent = temps;
        document.getElementById("updated-at").textContent = data[0].created_at;
      }
    });
}

const rangeEl = document.getElementById("range");
// Re-fetch historical data whenever the user changes the time range dropdown
rangeEl.addEventListener("change", () => {
  fetchData(parseInt(rangeEl.value));
});

// Initial data load and periodic refresh:
fetchData(6);                                        // Load last 6 hours on page load
fetchCurrent();                                      // Load current temps immediately
setInterval(() => fetchCurrent(), 10000);             // Refresh current temps every 10s
setInterval(() => fetchData(parseInt(rangeEl.value)), 30000);  // Refresh chart every 30s
</script>
</body>
</html>
