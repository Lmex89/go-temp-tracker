<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
<!-- Fuentes: IBM Plex Mono para datos técnicos, Orbitron para títulos de sci-fi -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Color scheme: Deep space blacks + phosphor green + amber warning + cyan accent */
  --bg-primary: #050a15;
  --bg-secondary: #0a1120;
  --bg-tertiary: #0f1729;
  --border-subtle: #1e2a3a;
  --border-glow: #1e3a4a;
  --text-primary: #e2e8f0;
  --text-secondary: #8b9eb0;
  --text-muted: #4a5568;
  --accent-green: #00ff88;
  --accent-amber: #ffaa00;
  --accent-cyan: #00d4ff;
  --accent-red: #ff3366;
  --glow-green: rgba(0, 255, 136, 0.3);
  --glow-cyan: rgba(0, 212, 255, 0.3);
  --glow-amber: rgba(255, 170, 0, 0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'IBM Plex Mono', 'Space Mono', monospace;
  background-color: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* Grid background pattern - líneas técnicas sutiles */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* CRT scanline overlay - efecto de monitor retro */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.03) 0px,
    rgba(0, 0, 0, 0.03) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 9999;
}

/* Layout container */
.container {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 24px;
}

/* ===================================================================
   HEADER - Panel de título estilo misión espacial
   =================================================================== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-subtle);
  position: relative;
}

.header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 200px;
  height: 1px;
  background: linear-gradient(90deg, var(--accent-cyan), transparent);
  box-shadow: 0 0 8px var(--glow-cyan);
}

.header-left h1 {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.8rem;
  color: var(--text-primary);
  letter-spacing: 3px;
  text-transform: uppercase;
  text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
  margin-bottom: 4px;
}

.header-left .subtitle {
  font-size: 0.75rem;
  color: var(--text-secondary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.header-right {
  text-align: right;
}

.status-indicator {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.75rem;
  color: var(--accent-green);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-green);
  box-shadow: 0 0 8px var(--glow-green);
  animation: pulse-glow 2s ease-in-out infinite;
}

@keyframes pulse-glow {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--glow-green); }
  50% { opacity: 0.6; box-shadow: 0 0 16px var(--glow-green); }
}

/* ===================================================================
   CONTROL PANEL - Bordes técnicos con esquinas decorativas
   =================================================================== */
.panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  border-radius: 0;
  padding: 16px;
  margin-bottom: 20px;
  position: relative;
}

/* Decorative corners - marcas de esquina estilo técnico */
.panel::before, .panel::after,
.panel > .corner-tl::before, .panel > .corner-tl::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  border-color: var(--accent-cyan);
  border-style: solid;
  pointer-events: none;
}

.panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.panel::after { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
.panel .corner-bl::before { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; position: absolute; width: 12px; height: 12px; border-color: var(--accent-cyan); border-style: solid; }
.panel .corner-br::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; position: absolute; width: 12px; height: 12px; border-color: var(--accent-cyan); border-style: solid; }

/* Tech label in corner */
.panel-label {
  position: absolute;
  top: -8px;
  left: 16px;
  background: var(--bg-primary);
  padding: 0 8px;
  font-size: 0.65rem;
  color: var(--accent-cyan);
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Orbitron', sans-serif;
}

/* ===================================================================
   CONTROLS - Botones estilo terminal/retro
   =================================================================== */
.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.controls + .controls {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-subtle);
}

.controls label {
  font-size: 0.7rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.controls input, .controls button {
  font-family: 'IBM Plex Mono', monospace;
  border: 1px solid var(--border-subtle);
  border-radius: 2px;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 0.8rem;
  transition: all 0.2s ease;
}

.controls input {
  padding: 6px 10px;
}

.controls input:focus {
  outline: none;
  border-color: var(--accent-cyan);
  box-shadow: 0 0 6px rgba(0, 212, 255, 0.2);
}

.controls button {
  padding: 7px 14px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 0.7rem;
  position: relative;
  overflow: hidden;
}

.controls button::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
  transition: left 0.3s ease;
}

.controls button:hover {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
}

.controls button:hover::before {
  left: 100%;
}

.controls button:active {
  transform: translateY(1px);
}

.controls button.active {
  background: rgba(0, 212, 255, 0.15);
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  box-shadow: 0 0 8px rgba(0, 212, 255, 0.15);
}

.controls span {
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.controls .current-temp {
  color: var(--accent-green);
  font-weight: 600;
}

.status { color: var(--text-secondary); font-size: 0.75rem; }
.status strong { color: var(--accent-cyan); }
.error { color: var(--accent-red); font-size: 0.75rem; }

/* ===================================================================
   GAUGE ROW - Instrumentos estilo panel de avión/nave
   =================================================================== */
.gauge-section {
  margin-bottom: 24px;
}

.gauge-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
}

.gauge-frame {
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  padding: 16px;
  position: relative;
  overflow: hidden;
}

/* Corner accents on gauges */
.gauge-frame::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 20px; height: 20px;
  border-top: 2px solid var(--accent-cyan);
  border-left: 2px solid var(--accent-cyan);
}

.gauge-frame::after {
  content: '';
  position: absolute;
  bottom: 0; right: 0;
  width: 20px; height: 20px;
  border-bottom: 2px solid var(--accent-cyan);
  border-right: 2px solid var(--accent-cyan);
}

.gauge-wrapper {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0px;
  margin-top: -4px;
}

.gauge-canvas {
  width: 140px;
  height: 100px;
}

.gauge-data {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0px;
  margin-top: -2px;
}

.gauge-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.1;
  text-shadow: 0 0 8px rgba(226, 232, 240, 0.3);
}

.gauge-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.85rem;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 2px;
}

.gauge-sub {
  font-size: 0.78rem;
  color: var(--text-muted);
  letter-spacing: 1px;
}

/* ===================================================================
   CHART SECTIONS - Paneles de gráficos estilo monitor técnico
   =================================================================== */
.chart-section {
  margin-bottom: 24px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 0 4px;
}

.section-header h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.9rem;
  color: var(--text-secondary);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  position: relative;
  padding-left: 16px;
}

/* Decorative line before section title */
.section-header h2::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  background: var(--accent-cyan);
  box-shadow: 0 0 6px var(--glow-cyan);
  clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
}

.section-header .current-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  color: var(--accent-green);
  letter-spacing: 0.5px;
}

.chart-container {
  height: 340px;
  background: var(--bg-secondary);
  border: 1px solid var(--border-subtle);
  padding: 16px;
  position: relative;
}

/* Corner accents on chart containers */
.chart-container::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 16px; height: 16px;
  border-top: 2px solid var(--border-glow);
  border-left: 2px solid var(--border-glow);
}

.chart-container::after {
  content: '';
  position: absolute;
  bottom: 0; right: 0;
  width: 16px; height: 16px;
  border-bottom: 2px solid var(--border-glow);
  border-right: 2px solid var(--border-glow);
}

/* ===================================================================
   ANIMATIONS
   =================================================================== */
@keyframes fade-in-up {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.animate-in {
  animation: fade-in-up 0.6s ease-out forwards;
}

.gauge-frame:nth-child(1) { animation-delay: 0.1s; }
.gauge-frame:nth-child(2) { animation-delay: 0.2s; }
.gauge-frame:nth-child(3) { animation-delay: 0.3s; }
.gauge-frame:nth-child(4) { animation-delay: 0.4s; }

/* Responsive */
@media (max-width: 768px) {
  .container { padding: 12px; }
  .header { flex-direction: column; gap: 12px; }
  .header-left h1 { font-size: 1.4rem; }
  .gauge-row { grid-template-columns: repeat(2, 1fr); }
  .chart-container { height: 280px; }
  .controls { gap: 6px; }
}

@media (max-width: 480px) {
  .gauge-row { grid-template-columns: 1fr; }
  .section-header { flex-direction: column; align-items: flex-start; gap: 6px; }
}
</style>
</head>
<body>

<div class="container">

  <!-- Header estilo Mission Control -->
  <header class="header">
    <div class="header-left">
      <h1>System Monitor</h1>
      <div class="subtitle">Real-time telemetry dashboard</div>
    </div>
    <div class="header-right">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>ONLINE</span>
      </div>
      <div id="system-time" style="font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; font-family: 'IBM Plex Mono', monospace;"></div>
    </div>
  </header>

  <!-- Control Panel -->
  <div class="panel" style="animation: fade-in-up 0.5s ease-out forwards;">
    <span class="panel-label">Controls</span>
    <div class="controls">
      <span style="color: var(--text-secondary); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;">Range:</span>
      <button type="button" class="preset-btn active" data-range="5m">5 min</button>
      <button type="button" class="preset-btn" data-range="1h">1 hour</button>
      <button type="button" class="preset-btn" data-range="3h">3 hours</button>
      <button type="button" class="preset-btn" data-range="6h">6 hours</button>
      <button type="button" class="preset-btn" data-range="12h">12 hours</button>
      <button type="button" class="preset-btn" data-range="24h">24 hours</button>
      <button type="button" id="reset-zoom">Reset chart</button>
      <span class="status">Showing <strong id="active-range-label">6 hours</strong></span>
    </div>
    <div class="controls">
      <label for="range-from">From</label>
      <input id="range-from" type="datetime-local">
      <label for="range-to">To</label>
      <input id="range-to" type="datetime-local">
      <button type="button" id="apply-range">Apply range</button>
      <span id="range-error" class="error"></span>
    </div>
  </div>

  <!-- Gauge Row -->
  <div class="gauge-section">
    <div class="gauge-row">
      <div class="gauge-frame animate-in">
        <div class="gauge-wrapper">
          <canvas id="gauge-cpu" class="gauge-canvas"></canvas>
          <div class="gauge-data">
            <span class="gauge-value" id="gauge-cpu-value">--</span>
            <span class="gauge-label">CPU</span>
          </div>
        </div>
      </div>
      <div class="gauge-frame animate-in">
        <div class="gauge-wrapper">
          <canvas id="gauge-ram" class="gauge-canvas"></canvas>
          <div class="gauge-data">
            <span class="gauge-value" id="gauge-ram-value">--</span>
            <span class="gauge-label">RAM</span>
          </div>
        </div>
      </div>
      <div class="gauge-frame animate-in">
        <div class="gauge-wrapper">
          <canvas id="gauge-swap" class="gauge-canvas"></canvas>
          <div class="gauge-data">
            <span class="gauge-value" id="gauge-swap-value">--</span>
            <span class="gauge-label">SWAP</span>
          </div>
        </div>
      </div>
      <div class="gauge-frame animate-in">
        <div class="gauge-wrapper">
          <canvas id="gauge-disk" class="gauge-canvas"></canvas>
          <div class="gauge-data">
            <span class="gauge-value" id="gauge-disk-value">--</span>
            <span class="gauge-label">DISK /</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Temperature Chart -->
  <div class="chart-section" style="animation: fade-in-up 0.6s ease-out 0.2s both;">
    <div class="section-header">
      <h2>Temperature</h2>
      <span class="current-label" id="temp-current">Current: --</span>
    </div>
    <div class="chart-container"><canvas id="temp-chart"></canvas></div>
  </div>

  <!-- CPU Chart -->
  <div class="chart-section" style="animation: fade-in-up 0.6s ease-out 0.3s both;">
    <div class="section-header">
      <h2>CPU Usage</h2>
      <span class="current-label" id="cpu-current">Current: --</span>
    </div>
    <div class="chart-container"><canvas id="chart-cpu"></canvas></div>
  </div>

  <!-- Memory Chart -->
  <div class="chart-section" style="animation: fade-in-up 0.6s ease-out 0.4s both;">
    <div class="section-header">
      <h2>Memory Usage</h2>
      <span class="current-label" id="mem-current">Current: --</span>
    </div>
    <div class="chart-container"><canvas id="chart-memory"></canvas></div>
  </div>

  <!-- Load Chart -->
  <div class="chart-section" style="animation: fade-in-up 0.6s ease-out 0.5s both;">
    <div class="section-header">
      <h2>System Load</h2>
      <span class="current-label" id="load-current">Current: --</span>
    </div>
    <div class="chart-container"><canvas id="chart-load"></canvas></div>
  </div>

</div>

<script>
// =============================================================================
// DEFAULTS & CONFIG
// =============================================================================
const defaultConfig = {
  defaultTimeRange: { value: "3h" },
  refreshIntervals: { currentTempMs: 10000, chartDataMs: 30000 },
  colors: { palette: ["#00ff88", "#00d4ff", "#ffaa00", "#ff3366", "#a78bfa", "#fb7185", "#22d3ee", "#a3e635"] },
  chart: { lineTension: 0.1, pointRadius: 3, fillArea: true, yAxisMin: null, yAxisMax: null, showGridLines: true, maxTicksLimit: 8 },
  display: { decimalPlaces: 1, showLastUpdated: true, timeFormat24h: true },
  zoom: { wheelEnabled: true, dragEnabled: true, pinchEnabled: true },
  sensorFilter: { enabled: false, includePatterns: [] },
  gauge: { cpuMax: 100, ramMax: 100, swapMax: 100, diskMax: 100 },
  gaugeRefreshMs: { cpu: 5000, ram: 10000, swap: 60000, disk: 60000 },
};

let config = defaultConfig;

async function loadConfig() {
  try {
    const response = await fetch('/config.json');
    if (!response.ok) { console.warn('[Config] using defaults'); return defaultConfig; }
    const userConfig = await response.json();
    config = { ...defaultConfig, ...userConfig };
    console.log('[Config] loaded:', config);
    return config;
  } catch (e) {
    console.warn('[Config] error, using defaults:', e);
    return defaultConfig;
  }
}

function shouldIncludeSensor(sensorName) {
  if (!config.sensorFilter || !config.sensorFilter.enabled) return true;
  const patterns = config.sensorFilter.includePatterns || [];
  if (patterns.length === 0) return false;
  return patterns.some(p => sensorName.includes(p));
}

function formatBytes(bytes) {
  const units = ['B', 'KiB', 'MiB', 'GiB', 'TiB'];
  let i = 0, val = bytes;
  while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
  return val.toFixed(1) + ' ' + units[i];
}

// =============================================================================
// CLOCK
// =============================================================================
function updateClock() {
  const now = new Date();
  const timeStr = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + ' ' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');
  const el = document.getElementById('system-time');
  if (el) el.textContent = timeStr;
}
setInterval(updateClock, 1000);
updateClock();

// =============================================================================
// GAUGES - Doughnut style with custom colors
// =============================================================================
const gauges = {};

function createGauge(id, maxVal, unit) {
  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'doughnut',
    data: { datasets: [{ data: [0, 100], backgroundColor: ['#00ff88', '#0f172a'], borderWidth: 0 }] },
    options: {
      circumference: 180, rotation: 270, cutout: '80%',
      responsive: true, maintainAspectRatio: true,
      plugins: { tooltip: { enabled: false }, legend: { display: false } },
      animation: { animateRotate: true, duration: 800, easing: 'easeOutQuart' },
    },
  });
  gauges[id] = { chart, maxVal, unit };
}

function updateGauge(id, value) {
  const g = gauges[id];
  if (!g) return;

  // Validate value - must be a finite number, not null/undefined/NaN
  // If invalid, default to 0 instead of showing negative or NaN
  const safeValue = (typeof value === 'number' && isFinite(value) && value >= 0) ? value : 0;

  // Clamp percentage between 0 and 100 - never negative, never over 100
  const pct = Math.max(0, Math.min((safeValue / g.maxVal) * 100, 100));

  // Color based on percentage - green -> amber -> red
  const color = pct > 85 ? '#ff3366' : pct > 60 ? '#ffaa00' : '#00ff88';
  g.chart.data.datasets[0].data = [pct, 100 - pct];
  g.chart.data.datasets[0].backgroundColor = [color, '#0a1120'];
  g.chart.update();

  // Update the value text below the gauge (not overlaid on the canvas)
  const valueEl = document.getElementById(id + '-value');
  if (valueEl) {
    valueEl.textContent = safeValue.toFixed(1) + g.unit;
    valueEl.style.color = color;
    valueEl.style.textShadow = `0 0 10px ${color}66`;
  }
}

// =============================================================================
// CHARTS - Line charts with dark theme
// =============================================================================
const metricCharts = {};

function createMetricChart(id, yLabel, unitSuffix) {
  const ctx = document.getElementById(id).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: { datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "nearest", intersect: false },
      plugins: {
        legend: {
          labels: {
            color: "#8b9eb0",
            boxWidth: 12,
            padding: 12,
            font: { size: 11, family: "'IBM Plex Mono', monospace" }
          }
        },
        tooltip: {
          backgroundColor: "rgba(5, 10, 21, 0.95)",
          titleColor: "#00d4ff",
          bodyColor: "#e2e8f0",
          borderColor: "#1e3a4a",
          borderWidth: 1,
          padding: 12,
          cornerRadius: 4,
          displayColors: true,
          titleFont: { family: "'IBM Plex Mono', monospace", size: 12 },
          bodyFont: { family: "'IBM Plex Mono', monospace", size: 11 },
          callbacks: {
            title: function(ctx) {
              const d = new Date(ctx[0].parsed.x);
              return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
            },
            label: function(ctx) {
              const val = ctx.parsed.y.toFixed(config.display.decimalPlaces);
              return [`Origin: ${ctx.dataset.label}`, `Value: ${val}${unitSuffix}`];
            },
          },
        },
        zoom: {
          pan: { enabled: true, mode: "x" },
          zoom: {
            wheel: { enabled: config.zoom.wheelEnabled },
            pinch: { enabled: config.zoom.pinchEnabled },
            drag: { enabled: config.zoom.dragEnabled, backgroundColor: "rgba(0, 212, 255, 0.08)", borderColor: "rgba(0, 212, 255, 0.4)", borderWidth: 1 },
            mode: "x",
          },
        },
      },
      scales: {
        x: {
          type: "linear",
          ticks: {
            color: "#4a5568",
            maxTicksLimit: config.chart.maxTicksLimit,
            font: { family: "'IBM Plex Mono', monospace", size: 10 },
            callback: v => { const d=new Date(v); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
          },
          grid: { color: "#0f1729" },
          border: { color: "#1e2a3a" },
        },
        y: {
          title: { display: true, text: yLabel, color: "#8b9eb0", font: { family: "'IBM Plex Mono', monospace", size: 11 } },
          ticks: { color: "#4a5568", font: { family: "'IBM Plex Mono', monospace", size: 10 } },
          grid: { color: "#1e2a3a", display: config.chart.showGridLines },
          border: { color: "#1e2a3a" },
          min: config.chart.yAxisMin,
          max: config.chart.yAxisMax,
        },
      },
    },
  });
  chart.canvas.parentElement.style.height = "300px";
  metricCharts[id] = { chart, unitSuffix };
}

function loadMetricData(chartId, apiUrl) {
  fetch(apiUrl)
    .then(r => { if (!r.ok) throw new Error(r.statusText); return r.json(); })
    .then(data => {
      const mc = metricCharts[chartId];
      if (!mc) return;
      const palette = config.colors.palette;
      const allSensors = [...new Set(data.map(d => d.sensor))];
      const datasets = allSensors.map((sensor, i) => {
        const points = data.filter(d => d.sensor === sensor);
        const color = palette[i % palette.length];
        return {
          label: sensor,
          data: points.map(p => ({ x: new Date(p.created_at).getTime(), y: p.temp_c })),
          borderColor: color,
          backgroundColor: color + "22",
          fill: config.chart.fillArea || false,
          tension: config.chart.lineTension,
          pointRadius: config.chart.pointRadius,
          pointHoverRadius: config.chart.pointRadius + 2,
          pointBackgroundColor: color,
          pointBorderColor: "#050a15",
          pointBorderWidth: 2,
          borderWidth: 2,
        };
      });
      mc.chart.data.datasets = datasets;
      if (mc.chart.resetZoom) mc.chart.resetZoom();
      mc.chart.update('none');
    })
    .catch(err => console.error(`[${chartId}] fetch error:`, err));
}

// =============================================================================
// TIME RANGE
// =============================================================================
const rangePresets = {
  "5m": { label: "5 minutes", durationMs: 5*60*1000 },
  "1h": { label: "1 hour", durationMs: 60*60*1000 },
  "3h": { label: "3 hours", durationMs: 3*60*60*1000 },
  "6h": { label: "6 hours", durationMs: 6*60*60*1000 },
  "12h": { label: "12 hours", durationMs: 12*60*60*1000 },
  "24h": { label: "24 hours", durationMs: 24*60*60*1000 },
};

const state = { mode: "preset", preset: config.defaultTimeRange.value, from: null, to: null };

const presetButtons = [...document.querySelectorAll(".preset-btn")];
const fromInput = document.getElementById("range-from");
const toInput = document.getElementById("range-to");
const activeRangeLabel = document.getElementById("active-range-label");
const applyRangeButton = document.getElementById("apply-range");
const resetZoomButton = document.getElementById("reset-zoom");
const rangeError = document.getElementById("range-error");

function formatLocalInput(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}T${String(date.getHours()).padStart(2,"0")}:${String(date.getMinutes()).padStart(2,"0")}`;
}

function currentRangeBounds() {
  if (state.mode === "custom") return { from: fromInput.value, to: toInput.value, label: "custom range" };
  const preset = rangePresets[state.preset];
  const to = new Date();
  const from = new Date(to.getTime() - preset.durationMs);
  return { from: formatLocalInput(from), to: formatLocalInput(to), label: preset.label };
}

function syncInputs(bounds) { fromInput.value = bounds.from || ""; toInput.value = bounds.to || ""; }
function setActivePresetButton(key) { presetButtons.forEach(b => b.classList.toggle("active", b.dataset.range === key)); }
function setRangeLabel(label) { activeRangeLabel.textContent = label; }

function apiUrlForMetric(metricEndpoint) {
  const bounds = currentRangeBounds();
  if (!bounds.from || !bounds.to) return null;
  return `/api/${metricEndpoint}?from=${encodeURIComponent(new Date(bounds.from).toISOString())}&to=${encodeURIComponent(new Date(bounds.to).toISOString())}`;
}

function loadAllCharts() {
  const bounds = currentRangeBounds();
  setRangeLabel(bounds.label);
  syncInputs(bounds);
  rangeError.textContent = "";

  const charts = [
    { id: 'temp-chart', ep: 'temps' },
    { id: 'chart-cpu', ep: 'cpu' },
    { id: 'chart-memory', ep: 'memory' },
    { id: 'chart-load', ep: 'load' },
  ];
  charts.forEach(c => {
    const url = apiUrlForMetric(c.ep);
    if (url) loadMetricData(c.id, url);
  });
}

// =============================================================================
// CURRENT VALUES (gauges + labels)
// =============================================================================
function fetchGaugeCPUFetch() {
  fetch('/api/current/cpu')
    .then(r => r.json())
    .then(data => {
      const total = data.find(d => d.sensor === 'cpu/total');
      if (total) updateGauge('gauge-cpu', total.temp_c);
      const label = document.getElementById('cpu-current');
      if (label && total) label.textContent = `Current: ${total.temp_c.toFixed(1)}%`;
    })
    .catch(() => {});
}

function fetchGaugeRAM() {
  fetch('/api/current/memory')
    .then(r => r.json())
    .then(data => {
      const pct = data.find(d => d.sensor === 'memory/used_percent');
      const used = data.find(d => d.sensor === 'memory/used_bytes');
      const total = data.find(d => d.sensor === 'memory/total_bytes');
      if (pct) updateGauge('gauge-ram', pct.temp_c);
      const label = document.getElementById('mem-current');
      if (label && used && total) label.textContent = `Current: ${formatBytes(used.temp_c)} / ${formatBytes(total.temp_c)} (${pct.temp_c.toFixed(1)}%)`;
    })
    .catch(() => {});
}

function fetchGaugeSwap() {
  fetch('/api/current/swap')
    .then(r => r.json())
    .then(data => {
      const pct = data.find(d => d.sensor === 'swap/used_percent');
      if (pct) updateGauge('gauge-swap', pct.temp_c);
    })
    .catch(() => {});
}

function fetchGaugeDisk() {
  fetch('/api/current/disk')
    .then(r => r.json())
    .then(data => {
      const root = data.find(d => d.sensor === 'disk//');
      if (root) updateGauge('gauge-disk', root.temp_c);
    })
    .catch(() => {});
}

function fetchCurrentLoad() {
  fetch('/api/current/load')
    .then(r => r.json())
    .then(data => {
      const l1 = data.find(d => d.sensor === 'load/1min');
      const l5 = data.find(d => d.sensor === 'load/5min');
      const l15 = data.find(d => d.sensor === 'load/15min');
      const label = document.getElementById('load-current');
      if (label && l1 && l5 && l15) {
        label.textContent = `1m: ${l1.temp_c.toFixed(2)}  5m: ${l5.temp_c.toFixed(2)}  15m: ${l15.temp_c.toFixed(2)}`;
      }
    })
    .catch(() => {});
}

function fetchCurrentTemp() {
  fetch('/api/current')
    .then(r => r.json())
    .then(data => {
      const filtered = data.filter(d => shouldIncludeSensor(d.sensor));
      const label = document.getElementById('temp-current');
      if (filtered.length > 0) {
        label.textContent = 'Current: ' + filtered.map(d => `${d.sensor}: ${d.temp_c.toFixed(config.display.decimalPlaces)} C`).join(', ');
      }
    })
    .catch(() => {});
}

// =============================================================================
// EVENT HANDLERS
// =============================================================================
function setPresetRange(rangeKey) {
  state.mode = "preset"; state.preset = rangeKey; state.from = null; state.to = null;
  setActivePresetButton(rangeKey);
  loadAllCharts();
}

presetButtons.forEach(btn => { btn.addEventListener("click", () => setPresetRange(btn.dataset.range)); });

applyRangeButton.addEventListener("click", () => {
  if (!fromInput.value || !toInput.value) return;
  state.mode = "custom"; state.from = fromInput.value; state.to = toInput.value;
  setActivePresetButton("");
  loadAllCharts();
});

resetZoomButton.addEventListener("click", () => {
  Object.values(metricCharts).forEach(mc => { if (mc.chart.resetZoom) mc.chart.resetZoom(); });
});

// =============================================================================
// INITIALIZATION
// =============================================================================
async function initialize() {
  await loadConfig();
  state.preset = config.defaultTimeRange.value;

  // Create gauges
  createGauge('gauge-cpu', 100, '%');
  createGauge('gauge-ram', 100, '%');
  createGauge('gauge-swap', 100, '%');
  createGauge('gauge-disk', 100, '%');

  // Create metric charts
  createMetricChart('temp-chart', 'Temperature (C)', 'C');
  createMetricChart('chart-cpu', 'CPU Usage (%)', '%');
  createMetricChart('chart-memory', 'Memory Usage (%)', '%');
  createMetricChart('chart-load', 'Load Average', '');

  setActivePresetButton(state.preset);
  loadAllCharts();
  fetchCurrentTemp();
  fetchGaugeCPUFetch();
  fetchGaugeRAM();
  fetchGaugeSwap();
  fetchGaugeDisk();
  fetchCurrentLoad();

  // Periodic gauge refresh at their own intervals
  setInterval(fetchGaugeCPUFetch, config.gaugeRefreshMs?.cpu || 5000);
  setInterval(fetchGaugeRAM, config.gaugeRefreshMs?.ram || 10000);
  setInterval(fetchGaugeSwap, config.gaugeRefreshMs?.swap || 10000);
  setInterval(fetchGaugeDisk, config.gaugeRefreshMs?.disk || 10000);
  setInterval(fetchCurrentLoad, 10000);
  setInterval(fetchCurrentTemp, config.refreshIntervals.currentTempMs);

  // Periodic chart data refresh
  setInterval(loadAllCharts, config.refreshIntervals.chartDataMs);

  console.log('[Init] Dashboard initialized');
}
initialize();
</script>
