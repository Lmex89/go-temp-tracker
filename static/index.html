<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensor Temperature</title>
<!-- Chart.js library for rendering the time-series temperature chart -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
<style>
/* Dark theme styling — similar to a terminal dashboard aesthetic */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: radial-gradient(circle at top, #111c36, #0f172a 65%); color: #e2e8f0; padding: 20px; }
h1 { margin-bottom: 10px; font-size: 1.5rem; color: #38bdf8; }
.subtitle { margin-bottom: 18px; color: #94a3b8; font-size: 0.92rem; }
.panel { background: rgba(15, 23, 42, 0.72); border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 16px; backdrop-filter: blur(6px); }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.controls + .controls { margin-top: 10px; }
.controls label { font-size: 0.875rem; color: #94a3b8; display: inline-flex; gap: 6px; align-items: center; }
.controls input, .controls button { border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-size: 0.875rem; }
.controls input { padding: 6px 10px; }
.controls button { padding: 7px 12px; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease; }
.controls button:hover { background: #263449; border-color: #475569; }
.controls button:active { transform: translateY(1px); }
.controls button.active { background: #0369a1; border-color: #38bdf8; color: #f8fafc; }
.controls span { font-size: 0.875rem; color: #94a3b8; }
.controls .current-temp { color: #4ade80; font-weight: 600; }
.status { color: #cbd5e1; font-size: 0.875rem; }
.status strong { color: #38bdf8; }
.error { color: #fca5a5; font-size: 0.875rem; }
.chart-container { height: 420px; background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
.chart-actions { margin-top: 12px; display: flex; justify-content: flex-end; }
</style>
</head>
<body>
<h1>Sensor Temperature Monitor</h1>
<div class="subtitle">Preset zoom buttons use backend date ranges. You can also drag, wheel zoom, or query a custom time window.</div>
<div class="panel">
  <div class="controls">
    <span>Zoom:</span>
    <button type="button" class="preset-btn active" data-range="5m">5 min</button>
    <button type="button" class="preset-btn" data-range="3h">3 hours</button>
    <button type="button" class="preset-btn" data-range="6h">6 hours</button>
    <button type="button" class="preset-btn" data-range="12h">12 hours</button>
    <button type="button" id="reset-zoom">Reset chart</button>
    <span class="status">Showing <strong id="active-range-label">6 hours</strong></span>
  </div>
  <div class="controls">
    <label for="range-from">From</label>
    <input id="range-from" type="datetime-local">
    <label for="range-to">To</label>
    <input id="range-to" type="datetime-local">
    <button type="button" id="apply-range">Apply range</button>
    <span>| Current: <span id="current-temp" class="current-temp">--</span></span>
    <span>Updated: <span id="updated-at">--</span></span>
    <span id="range-error" class="error"></span>
  </div>
</div>
<!-- Canvas where Chart.js renders the temperature-over-time line chart -->
<div class="chart-container">
  <canvas id="temp-chart"></canvas>
</div>

<script>
// =============================================================================
// CONFIGURATION LOADING
// =============================================================================
// Load user preferences from config.json, falling back to defaults if unavailable
// This is like Python's json.load() with try/except for defaults

// Default configuration - used if config.json fails to load or is missing
const defaultConfig = {
  defaultTimeRange: { value: "6h" },
  refreshIntervals: { currentTempMs: 10000, chartDataMs: 30000 },
  colors: { palette: ["#38bdf8", "#4ade80", "#f472b6", "#fbbf24", "#a78bfa"] },
  chart: { lineTension: 0.3, pointRadius: 2, fillArea: false, yAxisMin: null, yAxisMax: null, showGridLines: true, maxTicksLimit: 12 },
  display: { decimalPlaces: 1, showLastUpdated: true, timeFormat24h: true },
  zoom: { wheelEnabled: true, dragEnabled: true, pinchEnabled: true }
};

// Global config variable - populated by loadConfig()
let config = defaultConfig;

// loadConfig fetches config.json and merges with defaults
// Returns a Promise that resolves when config is loaded
async function loadConfig() {
  try {
    const response = await fetch('/config.json');
    if (!response.ok) {
      console.warn('[Config] Could not load config.json, using defaults');
      return defaultConfig;
    }
    const userConfig = await response.json();
    // Deep merge user config with defaults (shallow merge is sufficient for our flat structure)
    config = { ...defaultConfig, ...userConfig };
    console.log('[Config] Loaded user preferences:', config);
    return config;
  } catch (error) {
    console.warn('[Config] Error loading config, using defaults:', error);
    return defaultConfig;
  }
}

// =============================================================================
// CHART INITIALIZATION
// =============================================================================

// Get the 2D drawing context from the canvas element
const ctx = document.getElementById("temp-chart").getContext("2d");

// Chart instance - created after config is loaded
let chart = null;

// Initialize chart with config values
function initChart() {
  chart = new Chart(ctx, {
    type: "line",
    data: { datasets: [] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "nearest", intersect: false },
      plugins: {
        legend: { labels: { color: "#94a3b8" } },
        zoom: {
          pan: { enabled: true, mode: "x" },
          zoom: {
            wheel: { enabled: config.zoom.wheelEnabled },
            pinch: { enabled: config.zoom.pinchEnabled },
            drag: { enabled: config.zoom.dragEnabled, backgroundColor: "rgba(56, 189, 248, 0.12)", borderColor: "rgba(56, 189, 248, 0.6)", borderWidth: 1 },
            mode: "x",
          },
        },
      },
      scales: {
        x: {
          type: "linear",  // X-axis = milliseconds since epoch (numeric, not categorical)
          ticks: {
            color: "#64748b",
            maxTicksLimit: config.chart.maxTicksLimit,
            // Format the tick value (epoch ms) into HH:MM time string
            callback: v => { const d = new Date(v); return `${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`; },
          },
          grid: { color: "#1e293b" },
        },
        y: { 
          title: { display: true, text: "Temperature (°C)", color: "#94a3b8" }, 
          ticks: { color: "#64748b" }, 
          grid: { color: "#334155", display: config.chart.showGridLines },
          min: config.chart.yAxisMin,
          max: config.chart.yAxisMax,
        },
      },
    },
  });
  chart.canvas.parentElement.style.height = "400px";
}

// Color palette for sensor lines - uses config.colors.palette
// Cycles through colors if more sensors than colors available
const colors = config.colors.palette;

// Time range presets - map button values to duration and label
const rangePresets = {
  "5m": { label: "5 minutes", durationMs: 5 * 60 * 1000 },
  "3h": { label: "3 hours", durationMs: 3 * 60 * 60 * 1000 },
  "6h": { label: "6 hours", durationMs: 6 * 60 * 60 * 1000 },
  "12h": { label: "12 hours", durationMs: 12 * 60 * 60 * 1000 },
};

// Application state - default range from config
const state = {
  mode: "preset",
  preset: config.defaultTimeRange.value,
  from: null,
  to: null,
};

// DOM element references
const presetButtons = [...document.querySelectorAll(".preset-btn")];
const fromInput = document.getElementById("range-from");
const toInput = document.getElementById("range-to");
const activeRangeLabel = document.getElementById("active-range-label");
const applyRangeButton = document.getElementById("apply-range");
const resetZoomButton = document.getElementById("reset-zoom");
const rangeError = document.getElementById("range-error");

// formatLocalInput converts Date to datetime-local input format (YYYY-MM-DDTHH:MM)
function formatLocalInput(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  const hours = String(date.getHours()).padStart(2, "0");
  const minutes = String(date.getMinutes()).padStart(2, "0");
  return `${year}-${month}-${day}T${hours}:${minutes}`;
}

// currentRangeBounds returns {from, to, label} based on current state
// For presets, calculates from current time backwards
function currentRangeBounds() {
  if (state.mode === "custom") {
    return { from: fromInput.value, to: toInput.value, label: "custom range" };
  }

  const preset = rangePresets[state.preset];
  const to = new Date();
  const from = new Date(to.getTime() - preset.durationMs);
  return {
    from: formatLocalInput(from),
    to: formatLocalInput(to),
    label: preset.label,
  };
}

// syncInputs updates the datetime input fields with current range
function syncInputs(bounds) {
  fromInput.value = bounds.from || "";
  toInput.value = bounds.to || "";
}

// setActivePresetButton highlights the selected preset button
function setActivePresetButton(presetKey) {
  presetButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.range === presetKey));
}

// setRangeLabel updates the UI label showing current range
function setRangeLabel(label) {
  activeRangeLabel.textContent = label;
}

// apiUrlForCurrentRange constructs the API endpoint URL with time parameters
function apiUrlForCurrentRange() {
  const bounds = currentRangeBounds();
  if (!bounds.from || !bounds.to) {
    return null;
  }
  return `/api/temps?from=${encodeURIComponent(new Date(bounds.from).toISOString())}&to=${encodeURIComponent(new Date(bounds.to).toISOString())}`;
}

// loadRange fetches temperature data from API and updates the chart
// Each unique sensor gets its own colored line dataset
function loadRange() {
  const url = apiUrlForCurrentRange();
  if (!url) {
    return;
  }

  const bounds = currentRangeBounds();
  setRangeLabel(bounds.label);
  syncInputs(bounds);
  rangeError.textContent = "";

  console.log("[loadRange] fetching:", url);

  fetch(url)
    .then(async r => {
      if (!r.ok) {
        const text = await r.text();
        console.error("[loadRange] HTTP error:", r.status, text);
        throw new Error(text);
      }
      return r.json();
    })
    .then(data => {
      console.log("[loadRange] received", data.length, "readings");
      const sensors = [...new Set(data.map(d => d.sensor))];
      const datasets = sensors.map((sensor, i) => {
        const points = data.filter(d => d.sensor === sensor);
        return {
          label: sensor,
          data: points.map(p => ({ x: new Date(p.created_at).getTime(), y: p.temp_c })),
          borderColor: colors[i % colors.length],
          backgroundColor: colors[i % colors.length] + "33",
          fill: config.chart.fillArea,
          tension: config.chart.lineTension,
          pointRadius: config.chart.pointRadius,
        };
      });
      chart.data.datasets = datasets;
      if (chart.resetZoom) {
        chart.resetZoom();
      }
      chart.update();
    })
    .catch(err => {
      console.error("[loadRange] failed:", err);
      chart.data.datasets = [];
      chart.update();
      rangeError.textContent = err.message || "Failed to load range";
    });
}

// fetchCurrent gets the latest temperature reading per sensor
// Displays formatted temps in the control bar
function fetchCurrent() {
  fetch("/api/current")
    .then(r => r.json())
    .then(data => {
      if (data.length > 0) {
        // Format: "sensor1: 45.0°C, sensor2: 52.3°C"
        const temps = data.map(d => `${d.sensor}: ${d.temp_c.toFixed(config.display.decimalPlaces)}°C`).join(", ");
        document.getElementById("current-temp").textContent = temps;
        if (config.display.showLastUpdated) {
          document.getElementById("updated-at").textContent = data[0].created_at;
        }
      }
    });
}

// setPresetRange switches to a preset time range and reloads data
function setPresetRange(rangeKey) {
  state.mode = "preset";
  state.preset = rangeKey;
  state.from = null;
  state.to = null;
  setActivePresetButton(rangeKey);
  loadRange();
}

// Event listeners for preset buttons
presetButtons.forEach(btn => {
  btn.addEventListener("click", () => setPresetRange(btn.dataset.range));
});

// Event listener for custom range apply button
applyRangeButton.addEventListener("click", () => {
  if (!fromInput.value || !toInput.value) {
    return;
  }
  state.mode = "custom";
  state.from = fromInput.value;
  state.to = toInput.value;
  setActivePresetButton("");
  loadRange();
});

// Event listener for reset zoom button
resetZoomButton.addEventListener("click", () => {
  if (chart.resetZoom) {
    chart.resetZoom();
  }
});

// =============================================================================
// INITIALIZATION
// =============================================================================
// Load config, then initialize chart and start data updates

async function initialize() {
  // Load user configuration from config.json
  await loadConfig();
  
  // Initialize chart with config values
  initChart();
  
  // Update colors reference to use loaded config
  colors.length = 0;
  colors.push(...config.colors.palette);
  
  // Set initial state from config
  state.preset = config.defaultTimeRange.value;
  
  // Set initial button state
  setActivePresetButton(state.preset);
  
  // Load initial data
  loadRange();
  fetchCurrent();
  
  // Set up periodic refresh using config intervals
  setInterval(() => fetchCurrent(), config.refreshIntervals.currentTempMs);
  setInterval(() => loadRange(), config.refreshIntervals.chartDataMs);
  
  console.log('[Init] Dashboard initialized with config:', config);
}

// Start everything when page loads
initialize();
</script>
</body>
</html>
